name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest commit per branch needs to run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match go.mod. Running an older toolchain fails with
          # "no such tool covdata" once a dependency raises the language
          # version, which reads as a test failure rather than a version skew.
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        # The race detector needs cgo and a C toolchain; it is the single most
        # valuable check here because the cache's whole job is concurrent access.
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error

      # Smoke test the image on the runner's own architecture. The deploy image is
      # arm64 for Lambda, which cannot run here; this step deliberately builds
      # the default amd64 variant so the Dockerfile itself is exercised.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: server
          push: false
          load: true
          tags: weather-watcher:test
          cache-from: type=gha,scope=server

      - name: Smoke test the image
        run: |
          docker run -d --rm --name smoke -p 8080:8080 weather-watcher:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs smoke
          exit 1

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      # The e2e suite runs against the real Go server rather than a stub, so it
      # needs the backend up and reachable before Playwright starts.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: go build -o /tmp/weather-api ./cmd/server
        working-directory: backend

      - name: Start backend
        run: |
          /tmp/weather-api &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done

      # The Playwright config points at the preview server, which nothing was
      # serving. Without this the whole suite fails on ERR_CONNECTION_REFUSED,
      # which looks like an application bug and is not one.
      - name: Serve the built frontend
        working-directory: frontend
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173 && break
            sleep 1
          done

      - name: E2E tests
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Format check
        working-directory: terraform
        # Fails the build on drift instead of silently reformatting.
        run: terraform fmt -check -recursive -diff

      - name: Init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: terraform
        run: terraform validate

# The AWS resources this workflow used to publish to have been torn down.
# CI now builds and tests only; the Terraform files stay in the repository so
# the infrastructure can be recreated with a single apply if it is ever needed.
